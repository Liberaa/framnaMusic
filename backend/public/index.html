<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Framna Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Framna Music</h1>
      <p>Blippa ditt kort när du kommer in, så spelas din låt.</p>
    </header>

    <section>
      <h2>Länka ett kort</h2>
      <form id="link-form">
        <label>Namn <input name="name" required></label>
        <label>Kort-id <input name="tagId" placeholder="04:11:22:33" required></label>
        <label>Låt <input name="song" placeholder="ABBA - Dancing Queen" required></label>
        <button type="submit">Länka kort</button>
      </form>
      <p id="link-message" class="message" role="status"></p>
    </section>

    <section>
      <h2>Länkade kort</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Namn</th><th>Kort-id</th><th>Låt</th></tr>
          </thead>
          <tbody id="employee-list"></tbody>
        </table>
      </div>
      <p id="list-message" class="message" role="status"></p>
    </section>

    <section>
      <h2>Testa incheckning</h2>
      <p>Låtsas att du blippar ett kort.</p>
      <form id="checkin-form">
        <label>Kort-id <input name="tagId" placeholder="04:A1:B2:C3" required></label>
        <button type="submit">Checka in</button>
      </form>
      <p id="checkin-message" class="message" role="status"></p>
    </section>
  </main>

  <!-- Mall för en rad i tabellen, fylls i av app.js -->
  <template id="employee-row">
    <tr>
      <td class="name"></td>
      <td class="tag"></td>
      <td>
        <div class="song-edit">
          <input aria-label="Låt">
          <button type="button">Spara</button>
        </div>
      </td>
    </tr>
  </template>

  <script src="app.js"></script>
</body>
</html>
